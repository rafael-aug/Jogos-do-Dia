<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jogos de Hoje - Agenda & Transmissões</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JogosHoje">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Fonte Google Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0b0f17;
      --bg-card: #151c28;
      --bg-card-hover: #1c2536;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-primary: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
    }

    /* Top Bar Header */
    header {
      width: 100%;
      background: rgba(11, 15, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: center;
    }

    .header-content {
      width: 100%;
      max-width: 1200px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--accent-gradient);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .date-pill {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .install-btn {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: none;
    }

    .install-btn:hover {
      background: var(--accent-primary);
      color: #ffffff;
    }

    /* Busca e Filtros */
    .hero-bar {
      width: 100%;
      max-width: 1200px;
      padding: 24px 20px 12px 20px;
    }

    .search-box {
      width: 100%;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 14px 16px 14px 44px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
    }

    .tabs-wrapper {
      width: 100%;
      max-width: 1200px;
      padding: 0 20px;
      margin-bottom: 20px;
    }

    .tabs-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .tabs-container::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: var(--accent-gradient);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    /* Grid Responsivo */
    main {
      width: 100%;
      max-width: 1200px;
      padding: 0 20px;
    }

    .matches-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 768px) {
      .matches-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 1024px) {
      .matches-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* Card de Jogo */
    .match-card {
      background: var(--bg-card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 18px;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .match-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: var(--shadow-md);
      background: var(--bg-card-hover);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .league-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 20px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .tag-libertadores { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.25); }
    .tag-sulamericana { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.25); }
    .tag-serie-b { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.25); }
    .tag-champions { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25); }

    .match-time-badge {
      font-size: 0.8rem;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 10px;
      border-radius: 12px;
    }

    .teams-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0 18px 0;
    }

    .team-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .logo-wrapper {
      width: 56px;
      height: 56px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 50%;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .team-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    /* Escudo reserva elegante com iniciais caso a imagem falhe */
    .team-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent-gradient);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .team-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
      max-width: 100px;
    }

    .vs-text {
      font-size: 0.75rem;
      font-weight: 900;
      color: var(--text-dim);
      padding: 0 12px;
    }

    .broadcast-box {
      background: rgba(0, 0, 0, 0.25);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .tv-label {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .channels-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .channel-tag {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--card-border);
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="brand-logo">
        <div class="brand-icon">⚽</div>
        <div>
          <div class="brand-title">Jogos de Hoje</div>
          <div class="date-pill" id="current-date">Carregando...</div>
        </div>
      </div>
      <button class="install-btn" id="pwa-install-btn">📲 Instalar App</button>
    </div>
  </header>

  <section class="hero-bar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" class="search-input" placeholder="Buscar por time, campeonato ou canal..." oninput="handleSearch()">
    </div>
  </section>

  <section class="tabs-wrapper">
    <div class="tabs-container">
      <button class="tab-btn active" onclick="filterCategory('todos', this)"><span>🔥</span> Todos os Jogos</button>
      <button class="tab-btn" onclick="filterCategory('libertadores', this)"><span>🏆</span> Libertadores</button>
      <button class="tab-btn" onclick="filterCategory('sulamericana', this)"><span>⚽</span> Sul-Americana</button>
      <button class="tab-btn" onclick="filterCategory('serie-b', this)"><span>🇧🇷</span> Série B</button>
      <button class="tab-btn" onclick="filterCategory('champions', this)"><span>🇪🇺</span> Champions</button>
    </div>
  </section>

  <main>
    <div class="matches-grid" id="matches-grid"></div>
  </main>

  <footer>
    <p>Agenda de Futebol & Transmissões • PWA Pronto para Instalação</p>
  </footer>

  <script>
    // DADOS DOS JOGOS (Pode ser atualizado manualmente ou via API)
    const matchesData = [
      { id: 1, category: 'libertadores', leagueName: 'Copa Libertadores', tagClass: 'tag-libertadores', time: '19:00', homeTeam: 'Cerro Porteño', homeLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/3282.png', awayTeam: 'Palmeiras', awayLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/2029.png', channels: ['Paramount+'] },
      { id: 2, category: 'libertadores', leagueName: 'Copa Libertadores', tagClass: 'tag-libertadores', time: '21:30', homeTeam: 'Flamengo', homeLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/819.png', awayTeam: 'Cruzeiro', awayLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/2022.png', channels: ['TV Globo', 'ge.globo', 'Paramount+'] },
      { id: 3, category: 'sulamericana', leagueName: 'Copa Sul-Americana', tagClass: 'tag-sulamericana', time: '19:00', homeTeam: 'Atlético-MG', homeLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/816.png', awayTeam: 'RB Bragantino', awayLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/17154.png', channels: ['ESPN', 'Disney+'] },
      { id: 4, category: 'sulamericana', leagueName: 'Copa Sul-Americana', tagClass: 'tag-sulamericana', time: '21:30', homeTeam: 'Santa Fe', homeLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/3421.png', awayTeam: 'River Plate', awayLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/16.png', channels: ['ESPN', 'Disney+'] },
      { id: 5, category: 'serie-b', leagueName: 'Brasileirão Série B', tagClass: 'tag-serie-b', time: '19:30', homeTeam: 'Avaí', homeLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/6082.png', awayTeam: 'Sport', awayLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/2243.png', channels: ['Disney+'] },
      { id: 6, category: 'serie-b', leagueName: 'Brasileirão Série B', tagClass: 'tag-serie-b', time: '20:30', homeTeam: 'Cuiabá', homeLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/18800.png', awayTeam: 'Operário-PR', awayLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/19519.png', channels: ['Disney+'] },
      { id: 7, category: 'serie-b', leagueName: 'Brasileirão Série B', tagClass: 'tag-serie-b', time: '21:30', homeTeam: 'Botafogo-SP', homeLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/17855.png', awayTeam: 'Criciúma', awayLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/7754.png', channels: ['ESPN 4', 'Disney+'] },
      { id: 8, category: 'champions', leagueName: 'Champions League', tagClass: 'tag-champions', time: '16:00', homeTeam: 'Celtic', homeLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/303.png', awayTeam: 'LASK Linz', awayLogo: 'https://a.espncdn.com/i/teamlogos/soccer/500/2099.png', channels: ['Space', 'Max'] }
    ];

    let currentCategory = 'todos';

    // Data Atual
    const options = { weekday: 'long', day: 'numeric', month: 'long' };
    const todayFormatted = new Date().toLocaleDateString('pt-BR', options);
    document.getElementById('current-date').innerText = todayFormatted.charAt(0).toUpperCase() + todayFormatted.slice(1);

    // Renderização dos Jogos com Bypass de Hotlink e Fallback de Iniciais
    function renderMatches() {
      const container = document.getElementById('matches-grid');
      const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
      container.innerHTML = '';

      let filtered = currentCategory === 'todos' 
        ? matchesData 
        : matchesData.filter(m => m.category === currentCategory);

      if (searchTerm) {
        filtered = filtered.filter(m => 
          m.homeTeam.toLowerCase().includes(searchTerm) ||
          m.awayTeam.toLowerCase().includes(searchTerm) ||
          m.leagueName.toLowerCase().includes(searchTerm) ||
          m.channels.some(c => c.toLowerCase().includes(searchTerm))
        );
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>Nenhuma partida encontrada.</p></div>`;
        return;
      }

      filtered.forEach(match => {
        const channelsHTML = match.channels.map(c => `<span class="channel-tag">${c}</span>`).join('');
        
        // Iniciais para fallback
        const homeInitials = match.homeTeam.substring(0, 2).toUpperCase();
        const awayInitials = match.awayTeam.substring(0, 2).toUpperCase();

        const card = document.createElement('div');
        card.className = 'match-card';
        card.innerHTML = `
          <div>
            <div class="card-top">
              <span class="league-badge ${match.tagClass}">${match.leagueName}</span>
              <span class="match-time-badge">🕒 ${match.time}</span>
            </div>
            <div class="teams-section">
              <div class="team-col">
                <div class="logo-wrapper">
                  <img src="${match.homeLogo}" 
                       alt="${match.homeTeam}" 
                       class="team-logo" 
                       referrerpolicy="no-referrer"
                       onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                  <div class="team-avatar" style="display:none;">${homeInitials}</div>
                </div>
                <span class="team-name">${match.homeTeam}</span>
              </div>
              <div class="vs-text">VS</div>
              <div class="team-col">
                <div class="logo-wrapper">
                  <img src="${match.awayLogo}" 
                       alt="${match.awayTeam}" 
                       class="team-logo" 
                       referrerpolicy="no-referrer"
                       onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                  <div class="team-avatar" style="display:none;">${awayInitials}</div>
                </div>
                <span class="team-name">${match.awayTeam}</span>
              </div>
            </div>
          </div>
          <div class="broadcast-box">
            <span class="tv-label">📺 Onde assistir:</span>
            <div class="channels-flex">${channelsHTML}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterCategory(category, element) {
      currentCategory = category;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      renderMatches();
    }

    function handleSearch() {
      renderMatches();
    }

    renderMatches();

    // Registro do Service Worker (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }

    // Instalação PWA
    let deferredPrompt;
    const installBtn = document.getElementById('pwa-install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          installBtn.style.display = 'none';
        });
      }
    });
  </script>
</body>
</html>
